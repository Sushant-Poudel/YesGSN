name: gameshopnepal-api
region: sgp
services:
  - name: api
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      repo: sushant-poudel/yesgsn
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
    routes:
      - path: /
    envs:
      - key: MONGO_URL
        scope: RUN_TIME
        type: SECRET
      - key: DB_NAME
        scope: RUN_TIME
        value: gameshopnepal
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: TAKEAPP_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DISCORD_ORDER_WEBHOOK
        scope: RUN_TIME
        type: SECRET
      - key: IMGBB_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_HOST
        scope: RUN_TIME
        value: smtp.gmail.com
      - key: SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: SMTP_USER
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_FROM_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_FROM_NAME
        scope: RUN_TIME
        value: GameShop Nepal
      - key: SITE_URL
        scope: RUN_TIME
        value: https://gameshopnepal.com
      - key: DAILY_SUMMARY_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_DRIVE_FOLDER_ID
        scope: RUN_TIME
        type: SECRET
